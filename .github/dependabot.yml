version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current via reviewable PRs. Dependabot
  # reads the `# vX.Y.Z` comment next to each pinned SHA and bumps both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # `ci:` prefix so the bot's commits pass commitlint (conventional commits).
    commit-message:
      prefix: "ci"
    # One grouped PR per run instead of one PR per action.
    groups:
      github-actions:
        patterns: ["*"]

  # Dependabot's pip ecosystem understands pyproject.toml and uv.lock. The
  # workspace has one shared lockfile, so updates are rooted at `/` rather than
  # duplicated for each member package.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      python-dependencies:
        patterns: ["*"]
