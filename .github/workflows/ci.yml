name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: lint (ruff check)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          args: check packages/ tests/
      - name: format (ruff format)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          args: format --check packages/ tests/

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: |
          python -c "
          import ast, sys, glob
          files = glob.glob('packages/**/src/**/*.py', recursive=True) + glob.glob('tests/**/*.py', recursive=True)
          ok = True
          for f in sorted(set(files)):
              try:
                  with open(f) as fh: ast.parse(fh.read())
              except SyntaxError as e:
                  print(f'FAIL: {f}: {e}'); ok = False
          print(f'{len(files)} files checked')
          if not ok: sys.exit(1)
          "

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: Verify package notices match the repository notices
        run: |
          for package in packages/ltx-core-mlx packages/ltx-pipelines-mlx packages/ltx-trainer; do
            cmp LICENSE "$package/LICENSE"
            cmp NOTICE.md "$package/NOTICE.md"
          done
      - name: Build every workspace package
        run: uv build --all-packages --out-dir dist
      - name: Verify license files in wheels and source distributions
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          archives = sorted(
              path
              for path in Path("dist").iterdir()
              if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          )
          if len(archives) != 8:
              raise SystemExit(f"expected 8 archives (4 wheels + 4 sdists), found {len(archives)}: {archives}")

          for archive in archives:
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as built:
                      names = built.namelist()
              elif archive.name.endswith(".tar.gz"):
                  with tarfile.open(archive, "r:gz") as built:
                      names = built.getnames()
              else:
                  raise SystemExit(f"unexpected build artifact: {archive}")

              basenames = {PurePosixPath(name).name for name in names}
              missing = {"LICENSE", "NOTICE.md"} - basenames
              if missing:
                  raise SystemExit(f"{archive} is missing: {sorted(missing)}")
              print(f"verified {archive}")
          PY
      - name: Install built wheels without dependencies
        run: |
          uv venv --python 3.12 /tmp/ltx-wheel-smoke
          uv pip install --python /tmp/ltx-wheel-smoke/bin/python --no-deps dist/*.whl

  test:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: brew install ffmpeg
      - run: uv sync --frozen --all-extras
      - name: Type-check with ty
        run: uv run ty check
        continue-on-error: true
      - run: uv run pytest tests/ -v -m "not slow" --tb=short

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed  # v6.2.1
